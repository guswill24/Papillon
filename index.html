<body>
<iframe id="view" title="Presentación" allow="autoplay; fullscreen"></iframe>
<audio id="bgm" src="et_douloureux.ogg" loop preload="auto"></audio>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
// Deck shell: stays loaded (and fullscreen) while slides swap inside the iframe; music plays continuously.
const SLIDES=["sedifrale_animacion_1.html", "origines_perceptions_animacion_2.html", "les_echos_animacion_3.html", "points_cles_animacion_4.html", "triangle_pedagogique_animacion_5.html", "prompt_animacion_6.html", "quatre_piliers_animacion_7.html", "piliers_exemple_animacion_8.html", "notebooklm_video_animacion_9.html", "notebooklm_animacion_10.html", "personnaliser_video_animacion_11.html", "atouts_ia_oral_animacion_12.html", "outils_chatbots_animacion_13.html", "talkpal_qr_animacion_14.html", "talkpal_outils_animacion_15.html", "talkpal_animacion_16.html", "conclusions_animacion_17.html", "references_ombrelle_animacion18b.html", "machu_picchu_papillon_19.html"];
const view=document.getElementById('view'),bgm=document.getElementById('bgm'),PREF='audioPrefs',BGM_BASE=.15;
// Global audio preferences (on/off + volume) are set from each slide's bar and persist across slides and visits.
const norm=p=>{const v=parseFloat(p&&p.vol);return{on:!(p&&p.on===false),vol:isFinite(v)?Math.min(1,Math.max(0,v)):1}};
let pref=norm(null),hold=false; // hold: a slide's own video is playing, keep the music paused
try{pref=norm(JSON.parse(localStorage.getItem(PREF)))}catch(e){}
bgm.volume=BGM_BASE*pref.vol;
const play=()=>{if(pref.on&&!hold&&bgm.paused)bgm.play().catch(()=>{})};
function setAudio(p){pref=norm(p);bgm.volume=BGM_BASE*pref.vol;if(pref.on)play();else bgm.pause();
  try{localStorage.setItem(PREF,JSON.stringify(pref))}catch(e){}}
// Neighbour slides are prefetched into the HTTP cache; changes fade out, swap, and fade back in on load
let cur=0,navTok=0;
function prefetch(i){const h=SLIDES[i];if(!h||document.querySelector(`link[data-pre="${h}"]`))return;
  const l=document.createElement('link');l.rel='prefetch';l.href=h;l.dataset.pre=h;document.head.appendChild(l)}
function show(i){cur=i;hold=false;history.replaceState(null,'','#'+(i+1));
  if(!view.getAttribute('src')){view.src=SLIDES[i];return}
  const tok=++navTok;view.classList.add('out');setTimeout(()=>{if(tok===navTok)view.src=SLIDES[i]},250)}
view.onload=()=>{view.classList.remove('out');try{view.contentWindow.focus()}catch(e){};prefetch(cur+1);prefetch(cur-1)};
const n=parseInt(location.hash.slice(1),10);
show(n>=1&&n<=SLIDES.length?n-1:0);
addEventListener('message',e=>{
  const d=e.data;if(e.source!==view.contentWindow||!d||!d.deck)return;
  if(d.go){const i=SLIDES.indexOf(d.go);if(i>=0)show(i)}
  if(d.fs){const r=document.documentElement;
    if(document.fullscreenElement)document.exitFullscreen();else(r.requestFullscreen||r.webkitRequestFullscreen)?.call(r)}
  if(d.audioGet)e.source.postMessage({deckAudio:pref},'*');
  if(d.audio){setAudio(d.audio);return}
  if('hold' in d){hold=!!d.hold;if(hold){bgm.pause();return}}
  play();
});
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,play));
// Clicker keys reaching the shell (focus outside the slide) still change slides
addEventListener('keydown',e=>{if(e.repeat)return;
  const k=e.key,d=['PageDown','ArrowRight','ArrowDown'].includes(k)?1:['PageUp','ArrowLeft','ArrowUp'].includes(k)?-1:0;
  if(d&&SLIDES[cur+d]){e.preventDefault();show(cur+d)}});
</script>
<script>
// Offline: the service worker caches what is visited. Opening index.html?offline downloads the whole deck
// (slides, music, videos) so it can be presented without internet.
(()=>{
  if(!('serviceWorker' in navigator)||!window.caches)return;
  const CACHE='sedifrale-v1',VIDEOS=['asssets/education.mp4','asssets/exemple_talkpal.mp4'];
  const toast=document.getElementById('toast');
  const say=(t,ms)=>{toast.textContent=t;toast.hidden=false;clearTimeout(say.h);if(ms)say.h=setTimeout(()=>toast.hidden=true,ms)};
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(!new URLSearchParams(location.search).has('offline'))return;
  (async()=>{
    const files=['./','index.html','manifest.webmanifest','icons/icon-192.png','icons/icon-512.png','og-image.jpg','et_douloureux.ogg',...SLIDES,...VIDEOS];
    const cache=await caches.open(CACHE);let done=0,failed=0;
    say(`Guardando la presentación para usarla sin conexión… 0/${files.length}`);
    for(const f of files){
      try{const res=await fetch(f,{cache:'reload'});if(!res.ok)throw new Error(res.status);await cache.put(f,res)}catch(e){failed++}
      say(`Guardando la presentación para usarla sin conexión… ${++done}/${files.length}`);
    }
    say(failed?`No se pudieron guardar ${failed} archivos. Revisa la conexión y vuelve a abrir esta página.`
              :'Listo: la presentación funciona sin conexión en este navegador.',failed?0:8000);
  })();
})();
</script>
